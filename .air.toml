root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  delay = 2000 
  exclude_dir = ["assets", "tmp", "vendor", "Laravel"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"
  stop_on_error = true
  send_interrupt = true 

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
